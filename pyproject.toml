[project]
name = "lily"
version = "0.0.1"
description = "LLM inference engine with speculative decoding, SGLang architecture"
requires-python = ">=3.12,<3.13"
dependencies = [
    "torch>=2.8",
    "triton>=3.4",
    "transformers>=4.57",
    "safetensors>=0.5",
    "huggingface-hub>=0.30",
    "numpy>=2.0",
    "fastapi>=0.115",
    "uvicorn>=0.34",
    "pyzmq>=26",
    "pydantic>=2",
    "ninja>=1.13.2",
]

[project.optional-dependencies]
nf12 = ["nf12>=1.0.1"]  # --quantization nf12 (sm80+)

[dependency-groups]
dev = [
    "httpx>=0.28.1",
    "openai>=3.31.0",
    "pytest>=8",
    "pytest-timeout>=2",
]

[project.scripts]
lily-serve = "lily.entrypoints.launch:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["lily"]

[tool.pytest.ini_options]
testpaths = ["tests"]
timeout = 1200
addopts = "-ra"
